<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art 3D Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">Sentuh layar / Geser kursor untuk melihat efek 3D</div>

    <!-- Three.js Library dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, plane;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Load Texture menggunakan Image Objek & Canvas untuk memastikan kompatibilitas
            const textureLoader = new THREE.TextureLoader();
            
            // Mengambil gambar dari sumber yang ada
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = "1000294000.png"; // Jika di-hosting lokal/satu folder
            
            img.onload = function() {
                const texture = new THREE.CanvasTexture(img);
                texture.generateMipmaps = true;

                const geometry = new THREE.PlaneGeometry(4, 2.2, 64, 64);
                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    transparent: true,
                    roughness: 0.5,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });

                plane = new THREE.Mesh(geometry, material);
                scene.add(plane);
            };

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xfff5e6, 2, 50);
            pointLight.position.set(0, 2, 3);
            scene.add(pointLight);

            // Event Listeners untuk Mouse & Touch (Mobile)
            document.addEventListener('mousemove', onDocumentMouseMove);
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('resize', onWindowResize);
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        }

        function onTouchMove(event) {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - windowHalfX);
                mouseY = (event.touches[0].clientY - windowHalfY);
            }
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            if (plane) {
                plane.rotation.y += 0.05 * (targetX - plane.rotation.y);
                plane.rotation.x += 0.05 * (-targetY - plane.rotation.x);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
